<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>마이페이지 | 베뉴픽</title>
<meta name="description" content="내가 작성한 리뷰를 모아보고 수정·삭제할 수 있어요." />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="nav-bar">
  <a href="index.html" class="nav-logo"><span class="dot"></span>VenuePick</a>
  <div class="nav-links">
    <a href="index.html" class="nav-link">시설 찾기</a>
    <a href="mypage.html" class="nav-link active">마이페이지</a>
  </div>
  <div class="nav-actions">
    <button class="btn btn-outline btn-sm" id="authBtn">로그아웃</button>
  </div>
  <button class="nav-toggle" aria-label="메뉴 열기"></button>
</nav>

<main class="content-band">
  <div class="container">

    <div class="glass-card" id="profileCard" style="padding:24px; display:flex; align-items:center; gap:16px; margin-bottom:32px;">
      <div class="avatar" id="profileAvatar" style="width:48px; height:48px; font-size:18px;">P</div>
      <div>
        <div class="review-name" style="font-size:16px;">내 계정</div>
        <div class="review-meta" id="profileEmail"></div>
      </div>
    </div>

    <div class="mypage-header" id="myPageHeader">
      <div>
        <div class="section-eyebrow">마이페이지</div>
        <h2 class="section-title">내가 쓴 리뷰</h2>
        <p class="section-desc"><span id="myReviewCount">0</span>개의 리뷰를 작성했어요.</p>
      </div>
    </div>

    <div class="review-list" id="myReviewList"></div>

    <div class="glass-card empty-state" id="loginRequiredState" style="display:none; margin-top:24px;">
      <div class="icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </div>
      <p>로그인하면 볼 수 있어요</p>
      <button class="btn btn-outline btn-sm" id="myPageLoginBtn">로그인</button>
    </div>

    <div class="glass-card empty-state" id="myEmptyState" style="display:none; margin-top:24px;">
      <div class="icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </div>
      <p>아직 작성한 리뷰가 없어요</p>
      <a href="index.html" class="btn btn-outline btn-sm">시설 둘러보기</a>
    </div>

  </div>
</main>

<footer class="footer">
  <div class="container">
    <div>
      <div class="footer-brand">VenuePick</div>
      <div>이해관계 없는 실사용자 인증 리뷰로 MICE 시설·벤더 선정의 정보 비대칭을 해소합니다.</div>
    </div>
    <div>© 2026 VenuePick. All rights reserved.</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/env.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
</body>
</html>
